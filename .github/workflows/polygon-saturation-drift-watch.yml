name: Polygon Saturation Drift Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run immutable-seal drift audit
        run: |
          set -euo pipefail
          python tools/test_polygon_postclosure_audit.py
          python tools/polygon_postclosure_audit.py
