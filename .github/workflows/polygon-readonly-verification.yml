name: Polygon Read-Only Verification

on:
  push:
    paths:
      - "chains/polygon-pos/polygon_readonly_verifier.py"
      - "chains/polygon-pos/verification_targets.txt"
      - ".github/workflows/polygon-readonly-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polygon-rpc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only Polygon capability probe
        run: |
          set -euo pipefail
          python -m py_compile chains/polygon-pos/polygon_readonly_verifier.py
          python chains/polygon-pos/polygon_readonly_verifier.py             --rpc "https://polygon.drpc.org"             --rpc "https://polygon.publicnode.com"             --rpc "https://1rpc.io/matic"             --address "@chains/polygon-pos/verification_targets.txt"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-readonly-verification
          path: |
            polygon_rpc_observations.jsonl
            polygon_verifier_checkpoint.json
            polygon_rpc_head_summary.json
          if-no-files-found: warn
