name: Polygon Read-Only Verification

on:
  push:
    paths:
      - "chains/polygon-pos/polygon_readonly_verifier.py"
      - "chains/polygon-pos/verification_targets.txt"
      - "chains/polygon-pos/polygon_verification_reconciliation.py"
      - "chains/polygon-pos/rpc_pool.txt"
      - ".github/workflows/polygon-readonly-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polygon-rpc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TATUM_API_KEY: \${{ secrets.TATUM_API_KEY }}
    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m py_compile \
            chains/polygon-pos/polygon_readonly_verifier.py \
            chains/polygon-pos/polygon_verification_reconciliation.py

      - name: Run read-only Polygon verification with adaptive RPC rotation
        run: |
          set -euo pipefail
          verifier_status=0
          reconciliation_status=0
          python chains/polygon-pos/polygon_readonly_verifier.py \
            --rpc-pool-file chains/polygon-pos/rpc_pool.txt \
            --min-request-interval 0.5 \
            --min-code-endpoints 2 \
            --stale-block-tolerance 2 \
            --address "@chains/polygon-pos/verification_targets.txt" || verifier_status=$?
          python chains/polygon-pos/polygon_verification_reconciliation.py || reconciliation_status=$?
          if [ "$verifier_status" -ne 0 ]; then
            exit "$verifier_status"
          fi
          exit "$reconciliation_status"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-readonly-verification
          path: |
            polygon_rpc_observations.jsonl
            polygon_verifier_checkpoint.json
            polygon_rpc_head_summary.json
            polygon_verification_reconciliation.json
          if-no-files-found: warn
