name: Polygon Static Onchain Binding
on:
  push:
    paths:
      - ".github/workflows/polygon-static-onchain-binding.yml"
      - "tools/polygon_static_onchain_bind.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: polygon-static-onchain-binding
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and bind static market identities
        run: |
          set -euo pipefail
          python -m py_compile tools/polygon_static_onchain_bind.py
          python tools/polygon_static_onchain_bind.py

      - name: Verify hard static binding gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("chains/polygon-pos")
          b=json.loads((p/"STATIC_ONCHAIN_BINDING.json").read_text())
          assert b["chain_id"] == 137, b
          assert b["status"] == "GREEN", b
          assert b["pair_binding_complete"] is True, b
          assert b["pair_multi_rpc_complete"] is True, b
          assert b["token_multi_rpc"] == b["tokens"], b
          print("POLYGON_STATIC_ONCHAIN_BINDING_GREEN")
          print(json.dumps({
              "tokens": b["tokens"],
              "token_multi_rpc": b["token_multi_rpc"],
              "pairs": b["pairs"],
              "pair_bound": b["pair_bound"],
              "pair_multi_rpc": b["pair_multi_rpc"],
              "rpc_endpoints": b["rpc_endpoints"],
              "rpc_blocks": b["rpc_blocks"]
          }, sort_keys=True))
          PY

      - name: Update final static closure status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("chains/polygon-pos")
          b=json.loads((p/"STATIC_ONCHAIN_BINDING.json").read_text())
          m=json.loads((p/"MASTER_INDEX.json").read_text())
          s=json.loads((p/"STATIC_SATURATION_MANIFEST.json").read_text())
          m["onchain_binding_status"]="GREEN"
          m["static_closure_status"]="STATIC_MARKET_UNIVERSE_GREEN_WITH_MULTI_RPC_BINDING"
          m.setdefault("static_inputs",{})["onchain_binding"]="STATIC_ONCHAIN_BINDING.json"
          s["onchain_binding"]=b
          s["status"]="STATIC_MARKET_UNIVERSE_GREEN_WITH_MULTI_RPC_BINDING"
          (p/"MASTER_INDEX.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          (p/"STATIC_SATURATION_MANIFEST.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          PY

      - name: Commit canonical bound static layer
        run: |
          set -euo pipefail
          git config user.name "ghost-hunter-static-bot"
          git config user.email "ghost-hunter-static-bot@users.noreply.github.com"
          git add chains/polygon-pos tools/polygon_static_onchain_bind.py .github/workflows/polygon-static-onchain-binding.yml
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "feat: bind Polygon static universe to live onchain identities"
            git push origin HEAD:main
          fi
