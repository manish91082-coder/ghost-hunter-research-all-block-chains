name: Polygon Static Saturation
on:
  push:
    paths:
      - ".github/workflows/polygon-static-saturation.yml"
      - "tools/polygon_universe_worker.py"
      - "tools/polygon_static_materializer.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: polygon-static-saturation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build independent static fabric
        run: |
          set -euo pipefail
          python -m py_compile tools/polygon_static_fabric.py
          python tools/polygon_static_fabric.py

      - name: Validate static saturation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, gzip
          from pathlib import Path
          p=Path("chains/polygon-pos")
          m=json.loads((p/"STATIC_SATURATION_MANIFEST.json").read_text())
          c=m["counts"]
          assert c["tokens"] > 0 and c["pairs"] > 0 and c["pools"] == c["pairs"], c
          assert c["routes"] > 0, c
          assert c["strategies"] == 18, c
          assert c["exact_profit_certified"] == 0, c
          for fn in ["MASTER_INDEX.json","TOKEN_UNIVERSE.jsonl","PAIR_UNIVERSE.jsonl","POOL_UNIVERSE.jsonl","DEX_UNIVERSE.json","PROTOCOL_UNIVERSE.json","STATIC_CONTRACT_UNIVERSE.json","FLASH_LIQUIDITY_UNIVERSE.json","ROUTE_RULES.json","ROUTE_SAMPLE_5000.jsonl.gz","STRATEGY_UNIVERSE.json","FEATURE_SCHEMA.json","ECONOMIC_FRONTIER.json","UNKNOWN_NEGATIVE_SPACE.json","STATIC_EVIDENCE_MANIFEST.json","STATIC_SATURATION_MANIFEST.json"]:
              assert (p/fn).exists(), fn
          pairs=[json.loads(x) for x in (p/"PAIR_UNIVERSE.jsonl").read_text().splitlines() if x.strip()]
          ids=[x["pair_address"].lower() for x in pairs]
          assert len(ids)==len(set(ids))==c["pairs"]
          routes=sum(1 for _ in gzip.open(p/"ROUTE_UNIVERSE.jsonl.gz","rt",encoding="utf-8"))
          assert routes==c["routes"], (routes,c)
          print("POLYGON_STATIC_SATURATION_GREEN")
          print(json.dumps(c,sort_keys=True))
          PY

      - name: Commit canonical static layer
        run: |
          set -euo pipefail
          git config user.name "ghost-hunter-static-bot"
          git config user.email "ghost-hunter-static-bot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add -A chains/polygon-pos automation/universe automation/evidence/P5_CLOSURE_STATE.json automation/evidence/P5_CURSOR.json automation/evidence/P5_STABILITY_STATE.json automation/evidence/P5_PAIR_SNAPSHOT.json automation/evidence/P6_CLOSURE_STATE.json automation/evidence/P6_ROUTE_SNAPSHOT.json
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "feat: materialize Polygon canonical static hunting universe"
            git push origin HEAD:main
          fi
