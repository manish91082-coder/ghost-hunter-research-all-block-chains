name: Polygon Static Onchain Binding V2
on:
  push:
    paths:
      - ".github/workflows/polygon-static-onchain-binding-v2.yml"
      - "tools/polygon_static_onchain_bind_v2.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: polygon-static-onchain-binding-v2
  cancel-in-progress: false
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and bind Polygon static identities
        run: |
          set -euo pipefail
          python -m py_compile tools/polygon_static_onchain_bind_v2.py
          python tools/polygon_static_onchain_bind_v2.py

      - name: Verify terminal static closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("chains/polygon-pos")
          b=json.loads((p/"STATIC_ONCHAIN_BINDING.json").read_text())
          assert b["chain_id"] == 137
          assert b["status"] == "GREEN", b
          assert b["token_multi_rpc_complete"] is True, b
          assert b["pair_multi_rpc_complete"] is True, b
          assert b["tokens"] == 469, b
          assert b["pairs"] == 2821, b
          m=json.loads((p/"STATIC_SATURATION_MANIFEST.json").read_text())
          assert m["status"] == "STATIC_MARKET_UNIVERSE_GREEN_WITH_MULTI_RPC_BINDING", m
          print("POLYGON_STATIC_TERMINAL_GREEN")
          print(json.dumps({
            "rpc_endpoints": b["rpc_endpoints"],
            "rpc_blocks": b["rpc_blocks"],
            "tokens": b["tokens"],
            "token_multi_rpc": b["token_multi_rpc"],
            "pairs": b["pairs"],
            "pair_multi_rpc": b["pair_multi_rpc"],
            "pair_token_binding_pairs": b["pair_token_binding_pairs"],
            "adapter_family_counts": b["adapter_family_counts"]
          }, sort_keys=True))
          PY

      - name: Commit bound canonical static layer
        run: |
          set -euo pipefail
          git config user.name "ghost-hunter-static-bot"
          git config user.email "ghost-hunter-static-bot@users.noreply.github.com"
          git add chains/polygon-pos tools/polygon_static_onchain_bind_v2.py .github/workflows/polygon-static-onchain-binding-v2.yml
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "feat: close Polygon static multi-rpc binding"
            git push origin HEAD:main
          fi
